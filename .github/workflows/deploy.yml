name: Publicera 3D-takmodellen
# main -> https://3d.taklagret.se/   (skarp, alla kanaler)
# beta -> https://3d.taklagret.se/beta/   (för granskning innan skarp)
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
concurrency: deploy-${{ github.ref_name }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - name: Hämta Three.js 0.160.0
        run: npm pack three@0.160.0 --silent && tar xzf three-0.160.0.tgz
      - name: Bygg
        run: python3 build/build.py src/takmodell.html dist package
      - name: Ladda upp via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # ftp.taklagret.se pekar på Lovable (huvudsajten) – webbhotellet nås via 3d.taklagret.se
          server: 3d.taklagret.se
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ github.ref_name == 'main' && './' || './beta/' }}
